name: CBAS Telegram Alert 自動推播

on:
  schedule:
    # GitHub Action 使用的是 UTC 時間。台灣是 UTC+8。
    # 所以台灣晚上 21:00 = UTC 下午 13:00
    # Cron 格式: 分 時 日 月 星期 (這裡設定為每天 13:00 UTC)
    - cron: '0 13 * * *'
    
  workflow_dispatch: 
    # 加入這行，讓你可以隨時在 GitHub 網頁上手動點擊「Run workflow」來測試

jobs:
  run-python-script:
    runs-on: ubuntu-latest # 使用最新版的 Ubuntu 虛擬機

    steps:
      - name: 取得程式碼 (Checkout repository)
        uses: actions/checkout@v3

      - name: 設定 Python 3.10 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance

      - name: 執行 Python 腳本 (Run script)
        env:
          # 將 GitHub Secrets 帶入環境變數中，供 Python 讀取
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python converting price
